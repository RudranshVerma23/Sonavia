<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sonavia</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app"></div>
  <div id="empty" hidden>
    <div class="e-title"></div>
    <div class="e-sub"></div>
    <button type="button" class="e-btn" hidden></button>
  </div>
  <div id="set">
    <div class="row top">
      <label class="sw-l"><input type="checkbox" id="overlay"><span>Show the overlay</span></label>
      <button type="button" id="more" title="Overlay options" aria-expanded="false">⚙</button>
    </div>
    <div id="opts" hidden>
    <label class="row">
      <span>As</span>
      <select id="mode">
        <option value="page">A circle on web pages</option>
        <option value="pip">A floating window</option>
        <option value="desktop">A circle over every app (desktop add-on)</option>
      </select>
    </label>
    <div class="page-only">
      <label class="row"><span>Open the circle on hover</span><input type="checkbox" id="hover"></label>
      <label class="row"><span>Show it on every tab</span><input type="checkbox" id="alltabs"></label>
    </div>
    <div class="hint pip-only">The floating window opens from the overlay's ↗ button; this switch shows the overlay in the page first.</div>
    </div>
  </div>
  <script src="../content/overlay-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
