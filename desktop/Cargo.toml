[package]
name = "sonavia-desktop"
version = "1.5.0"
description = "Always-on-top transparent overlay for the Sonavia browser extension"
edition = "2021"

[[bin]]
name = "Sonavia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: serve the bundled ui/ folder (plain `cargo build` = production build)
tauri = { version = "2", features = ["custom-protocol"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
