<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sonavia</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app"></div>
  <div id="empty" hidden>
    <div class="e-title"></div>
    <div class="e-sub"></div>
    <button type="button" class="e-btn" hidden></button>
  </div>
  <div id="set">
    <label class="row">
      <span>Sonavia opens as</span>
      <select id="mode">
        <option value="popup">This popup</option>
        <option value="page">Overlay on pages</option>
        <option value="pip">Floating window</option>
        <option value="desktop">Desktop app</option>
      </select>
    </label>
    <div class="page-only">
      <label class="row"><span>Open the overlay on hover</span><input type="checkbox" id="hover"></label>
      <label class="row"><span>Show it on every tab</span><input type="checkbox" id="alltabs"></label>
    </div>
  </div>
  <script src="../content/overlay-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
